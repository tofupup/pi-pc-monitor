<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "What does the Critical Alert takeover look like?" (wayfinder ticket #11).
  Four structurally different takeovers at the Screen's real 1024x600, switchable via ?variant=A..D
  (or the bottom bar / arrow keys). The control panel stands in for the Go service: it feeds the page
  full state. Lives on the prototype/takeover branch only; never merge.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takeover prototype</title>
<style>
  /* ---------- harness (not part of the design) ---------- */
  html, body { margin: 0; background: #2a2d33; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #panel { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 8px 14px; background: #1b1d21; border-bottom: 1px solid #000; }
  #panel label { display: inline-flex; gap: 6px; align-items: center; }
  #panel select, #panel button { font: inherit; }
  #panel .hint { color: #8a8f98; }
  #stage { display: flex; justify-content: center; align-items: flex-start; padding: 14px 0 70px; }
  #scaler { transform-origin: top left; }
  #frame-wrap { outline: 10px solid #111; border-radius: 2px; }
  details#dump { margin: 0 14px 80px; }
  details#dump pre { background: #111; padding: 10px; overflow: auto; max-height: 300px; }
  #switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
    background: #fff; color: #111; border-radius: 999px; padding: 4px; box-shadow: 0 4px 18px rgba(0,0,0,.5); z-index: 10; font: 600 14px system-ui, sans-serif; }
  #switcher button { border: 0; background: #eee; border-radius: 999px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
  #switcher span { padding: 0 12px; min-width: 230px; text-align: center; }
  body.bare { background: #000; overflow: hidden; }
  body.bare #panel, body.bare #switcher, body.bare #dump { display: none; }
  body.bare #stage { padding: 0; justify-content: flex-start; }
  body.bare #frame-wrap { outline: 0; }

  /* ---------- the takeover (this is what's being judged) ---------- */
  #frame {
    --fg: #f2f3f5; --dim: #8a8f98; --line: #1c1e22; --red: #e0242b; --deep: #8c0f14; --warm: #ffb020;
    width: 1024px; height: 600px; overflow: hidden; position: relative; box-sizing: border-box;
    background: #000; color: var(--fg);
    font-family: "Inter", "DejaVu Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums;
  }
  #frame * { box-sizing: border-box; }
  #view { height: 100%; }
  .clamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .pulse .pulses { animation: pulse 2s ease-in-out infinite; }
  .nr { font-weight: 700; letter-spacing: .02em; }
  .nr::before { content: "●"; margin-right: .45em; }

  /* A: red banner + list */
  .A { display: grid; grid-template-rows: 84px 1fr auto; height: 100%; }
  .A .bar { background: var(--red); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
  .A .bar .h { font-size: 40px; font-weight: 800; letter-spacing: .04em; }
  .A .bar .c { font-size: 26px; font-weight: 600; opacity: .9; }
  .A .list { overflow: hidden; padding: 6px 26px 0; }
  .A .row { padding: 14px 0; border-bottom: 1px solid #26282d; display: grid; grid-template-columns: 1fr auto; column-gap: 20px; }
  .A .row:last-child { border-bottom: 0; }
  .A .t { font-size: 34px; font-weight: 700; line-height: 1.15; }
  .A .d { grid-column: 1 / -1; font-size: 23px; color: #c3c7ce; line-height: 1.3; margin-top: 6px; }
  .A .s { font-size: 20px; color: var(--dim); white-space: nowrap; padding-top: 8px; }
  .A .titles .row { padding: 10px 0; }
  .A .titles .t { font-size: 30px; }
  .A .more { font-size: 24px; color: var(--dim); padding: 12px 0; }
  .A .foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 26px 14px; border-top: 1px solid #26282d; font-size: 22px; color: var(--dim); min-height: 52px; }
  .A .foot .nr { color: var(--fg); background: #2a2d33; padding: 4px 14px; border-radius: 6px; }

  /* B: one alert at a time inside a red frame */
  .B { height: 100%; border: 16px solid var(--red); display: grid; grid-template-rows: auto 1fr auto; padding: 22px 34px 20px; }
  @keyframes frameblink { 0%, 100% { border-color: var(--red); } 50% { border-color: #3a0608; } }
  .pulse .B { animation: frameblink 2s ease-in-out infinite; }
  .B .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 24px; color: var(--red); font-weight: 800; letter-spacing: .08em; }
  .B .top .pg { color: var(--fg); font-weight: 600; letter-spacing: 0; }
  .B .body { display: flex; flex-direction: column; justify-content: center; }
  .B .t { font-size: 60px; font-weight: 800; line-height: 1.08; }
  .B .d { font-size: 30px; color: #c3c7ce; line-height: 1.32; margin-top: 18px; }
  .B .s { font-size: 24px; color: var(--dim); margin-top: 18px; }
  .B .bot { display: flex; justify-content: space-between; align-items: center; min-height: 34px; font-size: 24px; }
  .B .dots { display: flex; gap: 10px; }
  .B .dots i { width: 14px; height: 14px; border-radius: 50%; background: #3a3d44; display: block; }
  .B .dots i.on { background: var(--fg); }
  .B .nr { color: var(--fg); }
  .B .dm { color: var(--dim); font-size: 20px; }

  /* C: red flood, oldest as headline */
  .C { height: 100%; background: var(--deep); display: grid; grid-template-rows: auto auto 1fr auto; padding: 26px 34px 20px; }
  .C .k { font-size: 24px; font-weight: 800; letter-spacing: .12em; color: #ffb3b5; }
  .C .head { margin-top: 8px; }
  .C .head .t { font-size: 56px; font-weight: 800; line-height: 1.08; color: #fff; }
  .C .head .d { font-size: 27px; line-height: 1.3; color: #ffd9da; margin-top: 12px; }
  .C .head .s { font-size: 22px; color: #ffb3b5; margin-top: 10px; }
  .C .rest { overflow: hidden; margin-top: 18px; border-top: 2px solid rgba(255,255,255,.25); padding-top: 6px; }
  .C .rest .r { display: flex; justify-content: space-between; gap: 20px; font-size: 27px; padding: 7px 0; color: #fff; font-weight: 600; }
  .C .rest .r span:last-child { color: #ffb3b5; font-weight: 400; font-size: 21px; white-space: nowrap; }
  .C .rest .more { font-size: 22px; color: #ffb3b5; padding: 6px 0; }
  .C .bot { display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: #ffb3b5; min-height: 34px; }
  .C .nr { color: #000; background: #fff; padding: 4px 14px; border-radius: 6px; }

  /* D: light screen, alerts + what the PC reads now */
  .D { height: 100%; background: #f3f1ec; color: #111; display: grid; grid-template-columns: 1fr 250px; }
  .D .main { display: grid; grid-template-rows: auto 1fr auto; padding: 22px 26px 16px; border-left: 18px solid var(--red); min-height: 0; }
  .D .h { font-size: 30px; font-weight: 800; color: #b5121a; letter-spacing: .06em; }
  .D .list { overflow: hidden; margin-top: 8px; }
  .D .row { padding: 12px 0; border-bottom: 1px solid #d8d4cb; }
  .D .row:last-child { border-bottom: 0; }
  .D .t { font-size: 32px; font-weight: 800; line-height: 1.15; }
  .D .d { font-size: 22px; color: #3c3f45; line-height: 1.3; margin-top: 4px; }
  .D .s { font-size: 19px; color: #777; margin-top: 4px; }
  .D .titles .row { padding: 9px 0; }
  .D .titles .t { font-size: 28px; }
  .D .more { font-size: 22px; color: #777; padding: 10px 0; }
  .D .foot { font-size: 20px; color: #777; min-height: 30px; display: flex; align-items: center; }
  .D .side { background: #000; color: var(--fg); padding: 22px 22px; display: flex; flex-direction: column; gap: 6px; }
  .D .side .lbl { font-size: 17px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .D .side .v { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.02em; margin-bottom: 10px; }
  .D .side .v small { font-size: 26px; color: var(--dim); font-weight: 400; vertical-align: super; }
  .D .side .nr { margin-top: auto; color: #fff; background: var(--red); padding: 8px 12px; border-radius: 6px; font-size: 20px; }
  /* E: D with the red border on all four sides (the pick) */
  .D.E { border: 18px solid var(--red); }
  .D.E .main { border-left: 0; }
  .D .side .x { font-size: 18px; color: var(--dim); }
</style>
</head>
<body>

<div id="panel">
  <strong>PROTOTYPE</strong>
  <label>Active alerts
    <select id="count"><option>1</option><option selected>2</option><option>3</option><option>5</option><option>8</option></select>
  </label>
  <label>Text
    <select id="text"><option value="real" selected>Realistic</option><option value="max">Longest allowed (60 / 200 chars)</option><option value="bad">Includes unreadable file</option></select>
  </label>
  <label>Reports
    <select id="rep"><option value="live" selected>Arriving</option><option value="stopped">Stopped ("PC not reporting")</option></select>
  </label>
  <label>Dismissed alerts too
    <select id="dismissed"><option>0</option><option>1</option><option>2</option></select>
  </label>
  <label><input type="checkbox" id="pulse"> Slow pulse</label>
  <label>Size
    <select id="size"><option value="fit" selected>Fit window</option><option value="1">1:1 pixels</option></select>
  </label>
  <span class="hint">On the Screen 1 px ≈ 0.15 mm: 60 px type ≈ 9 mm. Variant B pages every 6 s.</span>
</div>

<div id="stage"><div id="scaler"><div id="frame-wrap"><div id="frame"><div id="view"></div></div></div></div></div>

<details id="dump"><summary>Page state (what the Go service would push)</summary><pre id="state"></pre></details>

<div id="switcher">
  <button id="prev" title="Previous (←)">‹</button>
  <span id="vlabel"></span>
  <button id="next" title="Next (→)">›</button>
</div>

<script>
// ---------------- fake alerts, shaped like Report `alerts` entries (ticket #6), oldest first ----------------
const ALERTS = [
  { id: 'drive-media-errors-S6B0NL0W123456@2026-11-22T09:41:07', title: 'Samsung 980 PRO (D:) media errors rising',
    detail: 'SMART media errors went from 121 to 138 in the last 24 hours. Back up D: and plan to replace the Drive.', since: 'Sat 22 Nov 09:41' },
  { id: 'whea-cpu@2026-11-24T03:14:52', title: 'Windows logged a hardware error',
    detail: 'WHEA-Logger event 18: fatal machine check on processor core 3 (cache hierarchy). The PC restarted at 03:12.', since: 'Today 03:14' },
  { id: 'kraken-pump@2026-11-24T14:02:10', title: 'Kraken pump stopped',
    detail: 'Pump has read 0 rpm for 30 s while liquid rose to 47 °C. Shut the PC down and check the pump cable.', since: 'Today 14:02' },
  { id: 'test@2026-11-24T14:20:33', title: 'Test alert',
    detail: 'Raised by pcmon alerts test. Clear it with pcmon alerts test --clear.', since: 'Today 14:20' },
  { id: 'drive-full-E@2026-11-24T14:31:00', title: 'Drive E: is 98% full',
    detail: '18 GB free of 1.8 TB.', since: 'Today 14:31' },
  { id: 'gpu-hotspot@2026-11-24T14:40:12', title: 'GPU hot spot over 105 °C',
    detail: 'Hot spot reached 107 °C at 100% load. Check the GPU fans and case airflow.', since: 'Today 14:40' },
  { id: 'backup@2026-11-24T15:00:00', title: 'Backup has failed for 3 days',
    detail: 'Last good backup: Fri 21 Nov 02:00.', since: 'Today 15:00' },
  { id: 'ups@2026-11-24T15:05:41', title: 'UPS on battery',
    detail: 'Mains power lost. 62% battery, about 14 minutes left.', since: 'Today 15:05' },
];
const MAX = { title: 'Samsung 980 PRO (D:) uncorrectable media errors are climbing',  // 60
  detail: 'SMART media and data integrity errors went from 121 to 138 in the last 24 hours and the available spare dropped to 4%. Back up everything on D: now and plan to replace this Drive before it fails.' }; // ~200
const BAD = { id: 'nvme-temp-E@2026-11-24T03:10:00', title: 'nvme-temp-E.txt', detail: "alert file couldn't be read", since: 'Today 03:10' };
const STATS = { cpu_temp_c: 72, gpu_temp_c: 66, liquid_temp_c: 34.8 };

// ---------------- harness: plays the Go service ----------------
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const VARIANTS = ['A', 'B', 'C', 'D', 'E'];
const NAMES = { A: 'Red banner + list', B: 'One at a time, red frame', C: 'Red flood, oldest as headline', D: 'Light screen + live temps', E: 'D, red border all round (the pick)' };
let variant = VARIANTS.includes(params.get('variant')) ? params.get('variant') : 'E';
let page = 0, pageAge = 0, state;

function buildState() {
  let alerts = ALERTS.map(a => ({ ...a }));
  if ($('text').value === 'max') Object.assign(alerts[0], MAX);
  if ($('text').value === 'bad') alerts.splice(1, 0, BAD);
  alerts = alerts.slice(0, +$('count').value);
  const reporting = $('rep').value === 'live';
  return {
    screen: 'takeover',
    alerts,                                   // only the ones that aren't Dismissed, oldest first
    dismissed_alerts: +$('dismissed').value,  // how many more are active but Dismissed
    reporting,                                // false → "PC not reporting" (timeout, stopping Report, or Pi boot)
    page: variant === 'B' ? page % alerts.length : undefined, // B only: the service steps this every 6 s
    stats: 'DE'.includes(variant) ? (reporting ? STATS : null) : undefined, // D only
  };
}
function tick() {
  if (++pageAge >= 6) { pageAge = 0; page++; }
  state = buildState(); render();
}

// ---------------- the page: a dumb renderer of state ----------------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const dismissedNote = n => n ? `+ ${plural(n, 'dismissed alert')} not shown` : '';
const NR = 'PC not reporting';

// Fit a list into its box: full rows → details clipped to one line → titles only → titles + "+N more".
function fitList(box, alerts, row, more) {
  const tries = [['full', alerts.length], ['clamp', alerts.length]];
  for (let k = alerts.length; k >= 1; k--) tries.push(['titles', k]);
  for (const [mode, k] of tries) {
    const shown = alerts.slice(0, k);
    box.className = box.className.replace(/\b(full|clamp|titles)\b/g, '').trim() + ' ' + mode;
    box.innerHTML = shown.map(a => row(a, mode)).join('') + (k < alerts.length ? more(alerts.length - k) : '');
    if (box.scrollHeight <= box.clientHeight + 1) return;
  }
}

const RENDER = {
  A(st) {
    const n = st.alerts.length;
    $('view').innerHTML = `<div class="A">
      <div class="bar pulses"><span class="h">⚠ CRITICAL ALERT</span><span class="c">${n > 1 ? plural(n, 'alert') : ''}</span></div>
      <div class="list"></div>
      ${st.reporting && !st.dismissed_alerts ? '' : `<div class="foot"><span>${dismissedNote(st.dismissed_alerts)}</span>${st.reporting ? '' : `<span class="nr">${NR}</span>`}</div>`}</div>`;
    fitList($('view').querySelector('.list'), st.alerts,
      (a, m) => `<div class="row"><div class="t">${esc(a.title)}</div><div class="s">${esc(a.since)}</div>
        ${m === 'titles' ? '' : `<div class="d ${m === 'clamp' ? 'clamp1' : ''}">${esc(a.detail)}</div>`}</div>`,
      k => `<div class="more">+ ${plural(k, 'more alert')}</div>`);
  },

  B(st) {
    const n = st.alerts.length, i = st.page, a = st.alerts[i];
    $('view').innerHTML = `<div class="B">
      <div class="top"><span>⚠ CRITICAL ALERT</span>${n > 1 ? `<span class="pg">${i + 1} of ${n}</span>` : ''}</div>
      <div class="body"><div class="t">${esc(a.title)}</div><div class="d">${esc(a.detail)}</div><div class="s">since ${esc(a.since)}</div></div>
      <div class="bot">${st.reporting ? '<span></span>' : `<span class="nr">${NR}</span>`}
        <span class="dm">${dismissedNote(st.dismissed_alerts)}</span>
        ${n > 1 ? `<span class="dots">${st.alerts.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</span>` : '<span></span>'}</div></div>`;
  },

  C(st) {
    const [first, ...rest] = st.alerts;
    $('view').innerHTML = `<div class="C">
      <div class="k pulses">⚠ CRITICAL ALERT${st.alerts.length > 1 ? ` · ${st.alerts.length}` : ''}</div>
      <div class="head"><div class="t">${esc(first.title)}</div><div class="d">${esc(first.detail)}</div><div class="s">since ${esc(first.since)}</div></div>
      <div class="rest" style="${rest.length ? '' : 'border:0'}"></div>
      <div class="bot">${st.reporting ? '<span></span>' : `<span class="nr">${NR}</span>`}<span>${dismissedNote(st.dismissed_alerts)}</span></div></div>`;
    const box = $('view').querySelector('.rest');
    for (let k = rest.length; k >= 0; k--) {
      box.innerHTML = rest.slice(0, k).map(a => `<div class="r"><span class="clamp1">${esc(a.title)}</span><span>${esc(a.since)}</span></div>`).join('')
        + (k < rest.length ? `<div class="more">+ ${plural(rest.length - k, 'more alert')}</div>` : '');
      if (box.scrollHeight <= box.clientHeight + 1) break;
    }
    // if even the headline's detail doesn't leave room, clip the detail to two lines
    if (box.clientHeight < 40 && rest.length) $('view').querySelector('.head .d').classList.add('clamp2');
  },

  D(st, pick) {
    const s = st.stats, t = v => v == null ? '—' : Math.round(v);
    $('view').innerHTML = `<div class="D ${pick ? 'E' : ''}">
      <div class="main"><div class="h ${pick ? '' : 'pulses'}">⚠ CRITICAL ALERT${st.alerts.length > 1 ? ` · ${st.alerts.length}` : ''}</div>
        <div class="list"></div><div class="foot">${dismissedNote(st.dismissed_alerts)}</div></div>
      <div class="side">
        <div class="lbl">CPU</div><div class="v">${t(s && s.cpu_temp_c)}<small>°</small></div>
        <div class="lbl">GPU</div><div class="v">${t(s && s.gpu_temp_c)}<small>°</small></div>
        <div class="lbl">Liquid</div><div class="v">${t(s && s.liquid_temp_c)}<small>°</small></div>
        ${st.reporting ? '<div class="x" style="margin-top:auto">live from the PC</div>' : `<div class="nr">${NR}</div>`}
      </div></div>`;
    fitList($('view').querySelector('.list'), st.alerts,
      (a, m) => `<div class="row"><div class="t">${esc(a.title)}</div>
        ${m === 'titles' ? '' : `<div class="d ${m === 'clamp' ? 'clamp1' : ''}">${esc(a.detail)}</div><div class="s">since ${esc(a.since)}</div>`}</div>`,
      k => `<div class="more">${pick ? `+${k} more` : `+ ${plural(k, 'more alert')}`}</div>`);
  },
  E(st) { RENDER.D(st, true); }, // never blinks, whatever the pulse box says
};

function render() {
  $('frame').classList.toggle('pulse', $('pulse').checked);
  RENDER[variant](state);
  $('vlabel').textContent = `${variant} (${NAMES[variant]})`;
  $('state').textContent = JSON.stringify(state, null, 2);
}

// ---------------- harness wiring ----------------
function setVariant(v) { variant = v; const p = new URLSearchParams(location.search); p.set('variant', v); try { history.replaceState(null, '', '?' + p); } catch (e) {} state = buildState(); render(); }
function step(d) { setVariant(VARIANTS[(VARIANTS.indexOf(variant) + d + VARIANTS.length) % VARIANTS.length]); }
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
addEventListener('keydown', e => { if (e.target.closest('input, textarea, select, [contenteditable]')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
for (const id of ['count', 'text', 'rep', 'dismissed', 'pulse']) $(id).onchange = () => { page = 0; pageAge = 0; state = buildState(); render(); };
function fit() {
  const s = $('size').value === 'fit' ? Math.min((innerWidth - 40) / 1044, (innerHeight - $('panel').offsetHeight - 100) / 620) : 1;
  $('scaler').style.transform = `scale(${s})`;
  $('stage').style.height = (620 * s + 20) + 'px'; $('scaler').style.width = '1044px';
  $('stage').style.width = '100%'; $('scaler').style.marginRight = (1044 * s - 1044) + 'px';
}
$('size').onchange = fit; addEventListener('resize', fit);
// Every control can also be set from the URL, e.g. ?variant=C&count=5&rep=stopped&dismissed=1&text=max
for (const id of ['count', 'text', 'rep', 'dismissed', 'size']) if (params.has(id)) $(id).value = params.get(id);
if (params.has('pulse')) $('pulse').checked = params.get('pulse') !== '0';
// ?bare: only the 1024x600 Screen at the top-left, e.g. for Chromium --kiosk on the real Pi
if (params.has('bare')) { document.body.classList.add('bare'); $('size').value = '1'; }
state = buildState(); render(); fit(); setInterval(tick, 1000);
</script>
</body>
</html>
